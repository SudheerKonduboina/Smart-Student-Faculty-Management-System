# Server Configuration
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_sms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
jwt.secret=${JWT_SECRET:SmartSMSSecretKey2024ForJWTTokenGenerationMinimum256BitsLong}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${FILE_UPLOAD_DIR:./uploads}
file.allowed.extensions=pdf,doc,docx,zip,txt,jpg,jpeg,png

# Attendance Warning Threshold (percentage)
attendance.warning.threshold=${ATTENDANCE_THRESHOLD:75}

# Python FastAPI Service
python.service.url=${PYTHON_SERVICE_URL:http://localhost:8001}
python.service.internal-key=${INTERNAL_SERVICE_KEY:SmartSMSInternalServiceKey2024}

# CORS
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Springdoc / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.operationsSorter=alpha

# Logging
logging.level.com.sms=INFO
logging.level.org.springframework.security=WARN
